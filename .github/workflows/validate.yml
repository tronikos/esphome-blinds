---
name: Validate configs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run against ESPHome dev, so upstream breaking changes surface here
    # before they reach users. See the install steps below.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Push/PR builds use the latest stable release so contributors are never
      # blocked by unrelated upstream churn. Only the weekly scheduled run
      # tracks dev, where a failure is an early warning rather than a blocker.
      - name: Install ESPHome (stable)
        if: github.event_name != 'schedule'
        run: pip install esphome

      - name: Install ESPHome (dev)
        if: github.event_name == 'schedule'
        run: pip install git+https://github.com/esphome/esphome@dev

      - name: Show ESPHome version
        run: esphome version

      - name: Validate every config
        # Resolves the package against this working tree, so a change is caught
        # here rather than by users pulling @main.
        # `shell: bash` is what gives us pipefail, so a failure here is not
        # swallowed by the pipe into tee.
        shell: bash
        run: esphome config tests/test-*.yaml 2>&1 | tee /tmp/esphome-config.log

      - name: Fail on strapping-pin warnings
        # esphome config exits 0 on strapping-pin warnings, so enforce them
        # here. No default pin in this package is a strapping pin, and none
        # should become one: GPIO12 (MTDI) held high at boot selects 1.8V flash
        # and stops most ESP32 modules from booting.
        shell: bash
        run: |
          found=$(grep -E 'is a strapping PIN' /tmp/esphome-config.log | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::Config uses a strapping pin:"
            echo "$found"
            exit 1
          fi
          echo "No strapping-pin warnings."


  esphome-compile:
    # Config validation does not expand lambdas, so compile one config per
    # platform to catch errors in the C++ they generate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.espressif
            tests/.esphome
          key: platformio-${{ hashFiles('tests/*.yaml') }}
          restore-keys: platformio-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile
        run: |
          esphome compile tests/test-defaults.yaml
          esphome compile tests/test-esp32.yaml
